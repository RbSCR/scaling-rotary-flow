name: Sync labels
on:
  workflow_dispatch:
  
jobs:
  labels:
    name: Sync labels
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Run label sync
        uses: srealmoreno/label-sync-action@v2.0.0
        with:
          config-file: ${{ github.workspace }}/label_manifest/labels_ros_packages.yml
          clean-labels: false
          repositories: |
              RbSCR/bno08x_rand
              RbSCR/bno08x_hardware_interface
              RbSCR/bno08x_sh2_libraries
          token: ${{ secrets.labelsync }}
